<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#050a12"><meta name="bvs-recovery" content="2026-09-09.4">
<title>Update BVS Protocol</title><link rel="icon" href="/assets/bvs-icon-192-r3.png"><link rel="apple-touch-icon" href="/assets/bvs-apple-touch-180-r3.png">
<style>html{color-scheme:dark}body{margin:0;background:#050a12;color:#eaf3ff;font:17px/1.6 system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center}main{box-sizing:border-box;width:min(540px,100%);padding:36px 24px;text-align:center}img{width:112px;height:112px;object-fit:contain}h1{font-size:30px;line-height:1.2}p{color:#b9cde3}button,a.action{box-sizing:border-box;display:inline-block;font:inherit;font-weight:650;border:1px solid #85b9e6;border-radius:28px;padding:13px 22px;color:#071525;background:#a9d4f6;cursor:pointer;text-decoration:none}#status{padding:18px;border:1px solid #29445f;border-radius:18px;min-height:54px}small{display:block;color:#a9bed3;margin:18px 0}details{text-align:left;margin-top:28px}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}a{color:#b5dcff}[hidden]{display:none!important}</style>
</head><body><main>
<img src="/assets/bvs-icon-192-r3.png?recovery=4" alt="BVS Protocol blue-and-silver atom">
<h1 id="title">Updating BVS Protocol</h1><p id="intro">Opening the version with the BVS icon and Download app button, without deleting your records.</p>
<p id="status" role="status" aria-live="polite">Checking the published app…</p>
<button id="retry" hidden>Try again</button><a id="open" class="action" href="/app.html?bvs_release=2026-09-09.4" hidden>Open the new BVS</a>
<small id="note">Your profile and history stay in this browser. Use Download app on the next screen to install.</small>
<details><summary id="diagnosticTitle">Update details</summary><pre id="diagnostics"></pre></details>
</main><script>
(() => {
'use strict';
const RELEASE='2026-09-09.4';
const params=new URLSearchParams(location.search);
const pt=params.get('lang')==='pt'||navigator.language.toLowerCase().startsWith('pt');
const t=pt?{title:'Atualizando o BVS Protocol',intro:'Abrindo a versão com o ícone BVS e o botão Download app, sem apagar seus registros.',checking:'Verificando a versão publicada…',refresh:'Substituindo os arquivos antigos do aplicativo…',done:'Ícone e botão de instalação verificados. Abrindo o BVS…',failed:'A versão nova não foi confirmada neste navegador. Abra este mesmo link no Chrome ou Safari e tente novamente.',retry:'Tentar novamente',open:'Abrir o BVS novo',note:'Seu perfil e histórico ficam neste navegador. Na próxima tela, use Download app para instalar.',details:'Detalhes da atualização'}:{title:'Updating BVS Protocol',intro:'Opening the version with the BVS icon and Download app button, without deleting your records.',checking:'Checking the published app…',refresh:'Replacing the old app files…',done:'Icon and installation button verified. Opening BVS…',failed:'The new version could not be verified in this browser. Open this same link in Chrome or Safari and try again.',retry:'Try again',open:'Open the new BVS',note:'Your profile and history stay in this browser. Use Download app on the next screen to install.',details:'Update details'};
const $=id=>document.getElementById(id);
for(const [id,key] of Object.entries({title:'title',intro:'intro',status:'checking',retry:'retry',open:'open',note:'note',diagnosticTitle:'details'}))$(id).textContent=t[key];
document.documentElement.lang=pt?'pt-BR':'en-GB';
let appURL='/app.html?bvs_release='+RELEASE,busy=false;
function log(message){$('diagnostics').textContent+=message+'\n'}
function bounded(promise,label){let timer;return Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(label)),15000)})]).finally(()=>clearTimeout(timer))}
function workerRelease(worker){return new Promise(resolve=>{
if(!worker){resolve(null);return}const channel=new MessageChannel();let settled=false;
const finish=value=>{if(settled)return;settled=true;clearTimeout(timer);channel.port1.close();resolve(value)};
const timer=setTimeout(()=>finish(null),1000);channel.port1.onmessage=event=>finish(event.data&&event.data.release);
try{worker.postMessage({type:'BVS_RELEASE_STATUS'},[channel.port2])}catch(_){finish(null)}
})}
async function run(){
if(busy)return;busy=true;$('retry').hidden=true;$('open').hidden=true;$('status').textContent=t.checking;
try{
const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);let response,html;
try{response=await fetch(appURL+'&check='+Date.now(),{cache:'no-store',signal:controller.signal});html=await response.text()}finally{clearTimeout(timer)}
const doc=new DOMParser().parseFromString(html,'text/html');
const publishedRelease=doc.querySelector('meta[name="bvs-release"]')?.content;
// Do not report success merely because an older page has a release marker.
if(!response.ok||!publishedRelease||!/^\d{4}-\d{2}-\d{2}\.\d+$/.test(publishedRelease)||publishedRelease.localeCompare(RELEASE,undefined,{numeric:true})<0||!doc.querySelector('#downloadApp[data-install]')||!doc.querySelector('.app-banner img'))throw new Error('The current app, icon and installation button did not reach this browser.');
appURL='/app.html?bvs_release='+encodeURIComponent(publishedRelease);$('open').href=appURL;
log('Published app verified: '+publishedRelease+'; Download app and BVS icon present.');
if(params.get('clean')!==RELEASE&&'serviceWorker' in navigator){
$('status').textContent=t.refresh;
const registrations=await bounded(navigator.serviceWorker.getRegistrations(),'Could not check the offline app.');
const bvs=registrations.filter(reg=>new URL(reg.scope).origin===location.origin&&new URL(reg.scope).pathname==='/');
let removed=false;
for(const reg of bvs){
if(await workerRelease(reg.active)===publishedRelease){log('Current offline app retained.');continue}
removed=(await bounded(reg.unregister(),'Could not refresh the offline app.'))||removed;
}
// Never read, clear or overwrite localStorage or IndexedDB. Keep a healthy current worker.
if(removed){
log('Obsolete offline registration removed; personal records untouched.');
const next=new URL('/update-bvs.html',location.origin);next.searchParams.set('lang',pt?'pt':'en');next.searchParams.set('clean',RELEASE);next.searchParams.set('check',String(Date.now()));
location.replace(next.href);return;
}
}
// The current app worker manages its own asset caches. Recovery does not delete them.
log('Profile, calendar, history and current offline cache were not deleted.');$('status').textContent=t.done;$('open').hidden=false;
location.replace(appURL);
}catch(error){log(String(error.message||error));$('status').textContent=t.failed;$('retry').hidden=false}
finally{busy=false}
}
$('retry').addEventListener('click',()=>{const next=new URL('/update-bvs.html',location.origin);next.searchParams.set('lang',pt?'pt':'en');next.searchParams.set('retry',String(Date.now()));location.replace(next.href)});
run();
})();
</script></body></html>
