<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BVS — previous records</title><style>body{background:#050a12;color:#eaf3ff;font:18px/1.6 system-ui;max-width:600px;margin:40px auto;padding:24px}a{color:#afd7ff}button{font:inherit;padding:14px;border-radius:20px;cursor:pointer}</style></head><body><h1>Your previous BVS records</h1><p>The live app now opens at the same address on every device. Records saved under this earlier address have not been deleted. They are not automatically transferred to another address.</p><p id="status" role="status"></p><button id="export">Save a private backup</button><p><a href="https://bvs-protocol.vercel.app/live.html">Open the live BVS app</a></p><script>document.getElementById('export').onclick=()=>{try{const records={};for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(/^bvs[_-]/i.test(key))records[key]=localStorage.getItem(key)}const keys=Object.keys(records);if(!keys.length){document.getElementById('status').textContent='There are no saved BVS records under this address in this browser.';return}const blob=new Blob([JSON.stringify({source:location.origin,exported:new Date().toISOString(),records},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='BVS-previous-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);document.getElementById('status').textContent='Backup saved. Your existing records are unchanged.'}catch(e){document.getElementById('status').textContent='This browser did not allow access to local records. No records were deleted.'}};</script></body></html>
