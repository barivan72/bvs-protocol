name: Verify BVS live publication
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: read
concurrency:
  group: bvs-live-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check application JavaScript syntax
        run: |
          for file in orbit/app.js orbit/data.js orbit/pwa.js orbit/sw.js; do node --check "$file"; done
          node --input-type=module --check < orbit/atom.js
      - name: Verify public website and required assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p verification
          python3 - <<'PY'
          import json, os, re, socket, subprocess, urllib.request, urllib.parse, time
          from pathlib import Path
          report = {'commit': os.environ['GITHUB_SHA'], 'dns': {}, 'sites': []}
          for domain in ['bvsprotocol.com', 'www.bvsprotocol.com']:
              try: report['dns'][domain] = sorted({x[4][0] for x in socket.getaddrinfo(domain, 443)})
              except Exception as exc: report['dns'][domain] = {'error': str(exc)}
          candidates = ['https://bvsprotocol.com/', 'https://www.bvsprotocol.com/']
          try:
              repo = os.environ['GITHUB_REPOSITORY']
              deployments = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/deployments?per_page=8'], text=True, timeout=25))
              for deployment in deployments:
                  statuses = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/deployments/{deployment["id"]}/statuses?per_page=1'], text=True, timeout=20))
                  for status in statuses:
                      url = status.get('environment_url')
                      if url and status.get('state') == 'success': candidates.append(url)
          except Exception as exc: report['deployment_discovery_error'] = str(exc)
          candidates.append('https://barivan72.github.io/bvs-protocol/')
          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'BVS-Protocol-Release-Verification/1.0', 'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.status, response.geturl(), response.headers.get('Content-Type', ''), response.read()
          for candidate in dict.fromkeys(candidates):
              item = {'requested_url': candidate, 'assets': []}
              try:
                  status, final_url, content_type, body = get(candidate)
                  html = body.decode('utf-8')
                  item.update(status=status, url=final_url, current_app='name="bvs-release"' in html)
                  release = re.search(r'name="bvs-release"\s+content="([^"]+)"', html)
                  item['release'] = release.group(1) if release else None
                  if item['current_app']:
                      paths = re.findall(r'(?:src|href)="([^"#]+)"', html)
                      paths += ['/sw.js'] if '.github.io/' not in final_url else []
                      for path in dict.fromkeys(paths):
                          if path.startswith(('https:', 'http:', 'data:', 'mailto:')): continue
                          asset_url = urllib.parse.urljoin(final_url, path)
                          asset = {'url': asset_url}
                          try:
                              astatus, _, actype, abody = get(asset_url)
                              asset.update(status=astatus, content_type=actype, bytes=len(abody))
                              if path.endswith('.webmanifest'):
                                  manifest = json.loads(abody)
                                  item['manifest'] = manifest
                                  for icon in manifest.get('icons', []):
                                      icon_url = urllib.parse.urljoin(asset_url, icon['src'])
                                      istatus, _, ictype, ibody = get(icon_url)
                                      item['assets'].append({'url': icon_url, 'status': istatus, 'content_type': ictype, 'bytes': len(ibody)})
                          except Exception as exc: asset['error'] = str(exc)
                          item['assets'].append(asset)
                      item['assets_ok'] = all(a.get('status') == 200 and a.get('bytes', 0) > 0 for a in item['assets'])
              except Exception as exc: item['error'] = str(exc)
              report['sites'].append(item)
          passed = [s for s in report['sites'] if s.get('current_app') and s.get('assets_ok')]
          report['verified_public_urls'] = [s['url'] for s in passed]
          report['custom_domain_verified'] = any(urllib.parse.urlparse(s['url']).hostname in ['bvsprotocol.com', 'www.bvsprotocol.com'] for s in passed)
          Path('verification/report.json').write_text(json.dumps(report, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('# BVS live publication verification\n\n')
              summary.write('```json\n' + json.dumps(report, indent=2) + '\n```\n')
          print(json.dumps(report, indent=2))
          if not passed: raise SystemExit('No current BVS app with all required assets was reachable publicly.')
          PY
      - name: Save verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bvs-live-verification
          path: verification/report.json
          if-no-files-found: warn
