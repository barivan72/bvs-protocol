name: Verify unified public BVS access
on:
  push:
    branches: [main]
    paths: ['scripts/build-static.mjs', 'orbit/origin-forward.js', 'vercel.json', '.github/workflows/unified-access.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bvs-unified-access
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build and check JavaScript
        run: |
          node scripts/build-static.mjs
          node --check orbit/sw.js
          node --check orbit/app-worker.js
          node --check orbit/origin-forward.js
          npm install --no-save playwright
          mkdir -p verification
      - name: Verify actual domain redirects and mobile app
        run: |
          timeout 230s node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs'),http=require('http');
          const LIVE='https://bvs-protocol.vercel.app/live.html';
          const report={commit:process.env.GITHUB_SHA,routes:[],screens:[]};
          const ok=(v,m)=>{if(!v)throw Error(m)};
          (async()=>{let browser,server;try{
            let published=false;
            for(let i=0;i<24;i++){
              try{const r=await fetch(LIVE+'?check='+Date.now(),{signal:AbortSignal.timeout(6000)});if(r.ok&&(await r.text()).includes('content="unified-6"')){published=true;break}}catch(_){}
              await new Promise(r=>setTimeout(r,2500));
            }
            ok(published,'Unified entry is not published');
            for(const host of ['bvsprotocol.com','www.bvsprotocol.com'])for(const path of ['/','/index.html','/index-v3.html','/app.html','/launch.html','/update-bvs.html','/orbit/','/orbit/index.html']){
              const url='https://'+host+path;
              const response=await fetch(url,{redirect:'manual',signal:AbortSignal.timeout(10000)});
              const location=response.headers.get('location');
              report.routes.push({url,status:response.status,location});
              ok([302,307,308].includes(response.status)&&location?.startsWith(LIVE),'Domain did not redirect to the verified origin: '+url);
            }
            for(const host of ['bvsprotocol.com','www.bvsprotocol.com','bvs-protocol.vercel.app']){
              const r=await fetch('https://'+host+'/sw.js?v=14');ok(r.ok&&(await r.text()).includes('BVS_ORIGIN_DISPATCH_6'),'Legacy worker URL broken');
            }
            browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            for(const width of [360,390,1440]){
              const context=await browser.newContext({viewport:{width,height:844},isMobile:width<600,hasTouch:width<600});
              const page=await context.newPage();page.setDefaultTimeout(18000);const errors=[];page.on('pageerror',e=>errors.push(String(e)));
              await page.goto('https://bvsprotocol.com/',{waitUntil:'networkidle'});
              ok(new URL(page.url()).origin===new URL(LIVE).origin,'Browser stayed on old origin');
              await page.locator('#downloadApp').waitFor({state:'visible'});
              const state=await page.evaluate(()=>({entry:document.querySelector('meta[name=bvs-entry]').content,icon:[...document.querySelectorAll('.brand img,.app-banner img')].every(i=>i.complete&&i.naturalWidth===192),download:document.getElementById('downloadApp').getBoundingClientRect().bottom<innerHeight,overflow:document.documentElement.scrollWidth>innerWidth+2,liveLabel:document.querySelector('.app-banner .release-label').textContent}));
              ok(state.entry==='unified-6'&&state.icon&&state.download&&!state.overflow,'Incorrect mobile UI');
              await page.screenshot({path:'verification/live-'+width+'.png'});
              await page.evaluate('installPrompt=null');await page.locator('#downloadApp').click();await page.locator('#detailDialog[open]').waitFor();await page.locator('.dialog-close').click();
              const data=await page.evaluate(()=>{document.querySelector('[data-water="250"]').click();document.querySelector('#scheduleList [data-check]').click();return{water:document.getElementById('waterAmount').textContent,taken:document.getElementById('takenCount').textContent}});
              await page.reload({waitUntil:'networkidle'});ok(await page.locator('#waterAmount').textContent()===data.water,'Water not retained');ok(await page.locator('#takenCount').textContent()===data.taken,'Taken not retained');
              ok(errors.length===0,'App JavaScript errors');report.screens.push({width,...state,installationHelp:true,persistence:true,errors});await context.close();
            }
            // An installed legacy cache must leave the old origin, not fetch another local copy.
            let repaired=false;
            const oldPage='<!doctype html><title>Old BVS</title><h1 id="old">Old version</h1><script>navigator.serviceWorker.register("/sw.js?v=14")</script>';
            const oldWorker='self.addEventListener("install",e=>e.waitUntil(self.skipWaiting()));self.addEventListener("activate",e=>e.waitUntil(self.clients.claim()));self.addEventListener("fetch",e=>{if(e.request.mode==="navigate")e.respondWith(new Response('+JSON.stringify(oldPage)+',{headers:{"Content-Type":"text/html"}}))});';
            server=http.createServer((req,res)=>{const p=new URL(req.url,'http://localhost').pathname;res.setHeader('Cache-Control','no-store');if(p==='/sw.js'){res.setHeader('Content-Type','application/javascript');res.end(repaired?fs.readFileSync('orbit/origin-forward.js'):oldWorker)}else{res.setHeader('Content-Type','text/html');res.end(p==='/saved-records.html'?'<title>Retained records</title>':oldPage)}});
            await new Promise(r=>server.listen(0,'127.0.0.1',r));const origin='http://127.0.0.1:'+server.address().port;
            const context=await browser.newContext(),page=await context.newPage();
            await page.goto(origin);await page.evaluate(()=>navigator.serviceWorker.ready);await page.reload();await page.locator('#old').waitFor();await page.evaluate(()=>localStorage.setItem('bvs_test_record','retained'));
            repaired=true;await page.evaluate(async()=>{const r=await navigator.serviceWorker.getRegistration();await r.update()});
            await page.waitForURL(u=>u.origin===new URL(LIVE).origin,{timeout:25000});await page.locator('#downloadApp').waitFor();
            const backup=await context.newPage();await backup.goto(origin+'/saved-records.html');ok(await backup.evaluate(()=>localStorage.getItem('bvs_test_record'))==='retained','Old records deleted');
            report.legacyOriginEscape={passed:true,recordsPreserved:true,destination:page.url()};await context.close();report.passed=true;
          }catch(e){report.passed=false;report.error=String(e);process.exitCode=1}finally{fs.writeFileSync('verification/unified-report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));if(browser)await browser.close();if(server)server.close()}})();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bvs-unified-live-verification
          path: verification/
          retention-days: 14
