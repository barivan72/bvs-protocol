name: BVS fault-tolerant update verification
on:
  push:
    branches: [main, repair/mobile-update5]
    paths: ['orbit/**','scripts/**','vercel.json','.github/workflows/repair-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bvs-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build portable static application
        run: |
          mkdir -p verification
          git show cb228e0a40f6dbde251e2279b47c798aa9031703:orbit/sw.js > verification/original-sw.js
          node scripts/build-static.mjs
          node --check orbit/sw.js
          node --check orbit/pwa.js
          python3 -m pip install --quiet playwright
      - name: Reproduce old failure and verify repaired mobile app
        run: timeout 160s python3 scripts/verify-repair.py
      - name: Verify the exact files on the production domains
        if: github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          import urllib.request,json,time,hashlib
          from pathlib import Path
          report=[]
          for host in ['bvsprotocol.com','www.bvsprotocol.com','bvs-protocol.vercel.app']:
            for route in ['/','/app.html','/launch.html']:
              url='https://'+host+route
              ok=False
              for attempt in range(12):
                try:
                  req=urllib.request.Request(url+'?verification=update5-'+str(time.time()),headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/142.0.0.0 Mobile Safari/537.36'})
                  with urllib.request.urlopen(req,timeout=8) as response:
                    html=response.read().decode();ok='name="bvs-updater" content="2026-09-09.5"' in html and 'id="downloadApp"' in html
                    if ok:report.append({'url':url,'status':response.status,'updater':'2026-09-09.5','downloadButton':True,'cache':response.headers.get('Cache-Control')});break
                except Exception:pass
                time.sleep(2)
              if not ok:raise SystemExit('Production update not verified: '+url)
            with urllib.request.urlopen('https://'+host+'/sw.js?verify=5',timeout=8) as r:worker=r.read()
            assert worker==Path('orbit/sw.js').read_bytes(),'Wrong worker on '+host
          Path('verification/production.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
          PY
      - name: Create host-independent publication archive
        if: success()
        run: cd orbit && zip -qr ../verification/BVS-approved-static.zip .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bvs-update5-verification
          path: verification/
          retention-days: 14
