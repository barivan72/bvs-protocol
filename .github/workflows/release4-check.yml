name: Verify BVS mobile installation release 4
on:
  push:
    branches: [main]
    paths: ['orbit/**', 'vercel.json', '.github/workflows/release4-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bvs-release4-check
  cancel-in-progress: true
jobs:
  mobile-install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser
        run: |
          mkdir -p verification
          npm install --no-save playwright
      - name: Verify production mobile UI and old offline-app upgrade
        run: |
          timeout 210s node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs'),http=require('http'),path=require('path');
          const RELEASE='2026-09-09.4';
          const report={release:RELEASE,routes:[],screens:[],errors:[]};
          const assert=(ok,message)=>{if(!ok)throw Error(message)};
          (async()=>{
            let browser,server;
            try{
              // Verify the live release, not merely a successful repository push.
              let published=false;
              for(let i=0;i<20;i++){
                try{const r=await fetch('https://bvsprotocol.com/app.html?verify=4-'+Date.now(),{signal:AbortSignal.timeout(8000)});const t=await r.text();if(r.ok&&t.includes('content="'+RELEASE+'"')){published=true;break}}catch(e){}
                await new Promise(r=>setTimeout(r,3000));
              }
              assert(published,'Release 4 did not reach the production domain');
              for(const host of ['bvsprotocol.com','www.bvsprotocol.com'])for(const p of ['/','/index.html','/index-v3.html','/app.html','/orbit/']){
                const r=await fetch('https://'+host+p+'?check='+Date.now(),{signal:AbortSignal.timeout(12000)}),text=await r.text();
                const valid=r.ok&&text.includes('content="'+RELEASE+'"')&&text.includes('id="downloadApp"');
                report.routes.push({url:'https://'+host+p,finalUrl:r.url,status:r.status,valid});assert(valid,'Old or missing page: '+host+p);
              }
              const manifest=await (await fetch('https://bvsprotocol.com/manifest.webmanifest')).json();
              assert(manifest.start_url.includes('/app.html')&&manifest.start_url.includes('20260909-4'),'Old manifest start URL');
              for(const icon of manifest.icons){const r=await fetch('https://bvsprotocol.com'+icon.src);const b=Buffer.from(await r.arrayBuffer());assert(r.ok&&b.subarray(0,4).equals(Buffer.from([137,80,78,71])),'Invalid icon '+icon.src)}
              report.manifest={startURL:manifest.start_url,icons:manifest.icons.length,valid:true};
              browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
              for(const width of [320,390,768,1440]){
                const context=await browser.newContext({viewport:{width,height:900}}),page=await context.newPage();
                page.setDefaultTimeout(20000);page.on('pageerror',e=>report.errors.push(String(e)));
                await page.goto('https://bvsprotocol.com/app.html?verify=4',{waitUntil:'networkidle'});
                await page.locator('#downloadApp').waitFor({state:'visible'});
                const result=await page.evaluate(()=>{
                  const button=document.getElementById('downloadApp'),box=button.getBoundingClientRect();
                  const icons=[...document.querySelectorAll('.brand img,.app-banner img')];
                  return{width:innerWidth,overflow:document.documentElement.scrollWidth>innerWidth+1,downloadVisible:box.width>0&&box.height>=44&&box.bottom<innerHeight,installTextSize:parseFloat(getComputedStyle(document.querySelector('.install-btn')).fontSize),spheresVisible:[...document.querySelectorAll('.hero-levels button')].every(b=>b.getBoundingClientRect().width>0),iconsLoaded:icons.every(i=>i.complete&&i.naturalWidth===192),release:document.querySelector('meta[name=bvs-release]').content,webgl:document.getElementById('atomFallback').classList.contains('loaded')};
                });
                assert(!result.overflow,'Horizontal overflow at '+width);assert(result.downloadVisible,'Download button not immediately visible at '+width);assert(result.installTextSize>=12,'Hidden install text');assert(result.spheresVisible,'Hidden BVS spheres');assert(result.iconsLoaded,'BVS icon failed to load');assert(result.release===RELEASE,'Stale release');
                await page.screenshot({path:'verification/bvs-'+width+'.png',fullPage:width===390});
                // Exercise the installation fallback without an OS-level prompt.
                await page.evaluate('installPrompt=null');await page.locator('#downloadApp').click();
                await page.locator('#detailDialog[open]').waitFor();assert((await page.locator('#dialogContent').innerText()).includes('home')||(await page.locator('#dialogContent').innerText()).includes('Chrome'),'Missing installation guidance');
                await page.locator('.dialog-close').click();
                // Also exercise the native installation path with a controlled browser event.
                await page.evaluate(()=>{window.testPromptCount=0;const e=new Event('beforeinstallprompt');e.prompt=async()=>{window.testPromptCount++};e.userChoice=Promise.resolve({outcome:'dismissed'});dispatchEvent(e)});
                await page.locator('#downloadApp').click();assert(await page.evaluate(()=>window.testPromptCount===1),'Native install prompt not called');
                report.screens.push({...result,installationFallback:true,nativeInstallHandler:true});
                await context.close();
              }
              // Reproduce an OLD app that returns a stale cached page for every navigation.
              let upgraded=false;
              const legacyHTML='<!doctype html><title>Old BVS test</title><h1 id="old">Old BVS</h1><script>navigator.serviceWorker.register("/sw.js")</script>';
              const legacySW='self.addEventListener("install",e=>e.waitUntil(caches.open("bvs-legacy-test").then(c=>c.add("/legacy.html")).then(()=>self.skipWaiting())));self.addEventListener("activate",e=>e.waitUntil(self.clients.claim()));self.addEventListener("fetch",e=>{if(e.request.mode==="navigate")e.respondWith(caches.match("/legacy.html"));});';
              const base=path.resolve('orbit');
              server=http.createServer((req,res)=>{
                let pathname=new URL(req.url,'http://localhost').pathname;
                res.setHeader('Cache-Control','no-store');
                if(pathname==='/sw.js'&&!upgraded){res.setHeader('Content-Type','application/javascript');res.end(legacySW);return}
                if(pathname==='/legacy.html'||(pathname==='/'&&!upgraded)){res.setHeader('Content-Type','text/html');res.end(legacyHTML);return}
                if(['/','/app.html','/index-v3.html','/orbit/'].includes(pathname))pathname='/index.html';
                const file=path.resolve(base,'.'+pathname);if(!file.startsWith(base+path.sep)||!fs.existsSync(file)||!fs.statSync(file).isFile()){res.statusCode=404;res.end('Not found');return}
                const ext=path.extname(file);res.setHeader('Content-Type',({'.html':'text/html','.js':'application/javascript','.css':'text/css','.png':'image/png','.json':'application/json','.webmanifest':'application/manifest+json'})[ext]||'application/octet-stream');res.end(fs.readFileSync(file));
              });
              await new Promise(r=>server.listen(0,'127.0.0.1',r));
              const origin='http://127.0.0.1:'+server.address().port;
              const context=await browser.newContext({viewport:{width:390,height:844}}),page=await context.newPage();page.setDefaultTimeout(25000);
              await page.goto(origin+'/');await page.evaluate(async()=>{await navigator.serviceWorker.ready});await page.reload();await page.locator('#old').waitFor();
              await page.evaluate(()=>{localStorage.setItem('bvs_upgrade_sentinel','retained');const d=new Date();const day=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;localStorage.setItem('bvs_v3_state',JSON.stringify({profile:{name:'Migration test',stage:'B'},events:{[day+'|vitd|08:00']:'taken'},water:{[day]:250}}))});
              upgraded=true;
              await page.evaluate(async()=>{const r=await navigator.serviceWorker.getRegistration();await r.update()});
              await page.waitForURL(url=>url.pathname==='/app.html',{waitUntil:'networkidle',timeout:30000});await page.locator('#downloadApp').waitFor();
              report.legacyUpgrade=await page.evaluate(()=>{const s=JSON.parse(localStorage.getItem('bvs_orbit_v1'));return{url:location.href,release:document.querySelector('meta[name=bvs-release]').content,storagePreserved:localStorage.getItem('bvs_upgrade_sentinel')==='retained',profilePreserved:s.profile.name==='Migration test',waterPreserved:s.events.some(e=>e.type==='water'&&e.amount===250),takenPreserved:s.events.some(e=>e.type==='supplement'&&e.status==='taken'),legacyBackupPreserved:!!localStorage.getItem('bvs_v3_state')}});
              assert(report.legacyUpgrade.release===RELEASE&&report.legacyUpgrade.storagePreserved&&report.legacyUpgrade.profilePreserved&&report.legacyUpgrade.waterPreserved&&report.legacyUpgrade.takenPreserved&&report.legacyUpgrade.legacyBackupPreserved,'Legacy update or data preservation failed');
              await context.setOffline(true);await page.reload({waitUntil:'networkidle'});await page.locator('#downloadApp').waitFor();
              assert(await page.locator('meta[name=bvs-release]').getAttribute('content')===RELEASE,'Offline load returned the old screen');report.offlineCurrentVersion=true;
              await context.close();assert(report.errors.length===0,'JavaScript errors in production');report.passed=true;
            }catch(e){report.passed=false;report.failure=String(e);process.exitCode=1}
            finally{fs.writeFileSync('verification/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));if(browser)await browser.close();if(server)server.close()}
          })();
          JS
      - name: Include reviewed source snapshot
        if: always()
        run: tar -czf verification/bvs-source.tar.gz orbit vercel.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bvs-mobile-release4-verification
          path: verification/
          retention-days: 14
