name: Verify public BVS update link
on:
  push:
    branches: [main]
    paths: ['orbit/**', 'vercel.json', '.github/workflows/recovery-public-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bvs-public-recovery
  cancel-in-progress: true
jobs:
  public-update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public update, app and legacy icon routes
        run: |
          mkdir -p verification
          python3 - <<'PY'
          import urllib.request, json
          rows=[]
          for host in ['bvsprotocol.com','www.bvsprotocol.com']:
              for path in ['/update-bvs.html?lang=pt&release=3','/app.html?bvs=20260909-3','/index-v3.html','/bvs-app-icon-192.png?v=14']:
                  url='https://'+host+path
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=15) as r:
                      data=r.read()
                      assert r.status==200
                      assert (b'bvs-recovery' in data if '/update-bvs' in path else data.startswith(b'\x89PNG') if '.png' in path else b'name="bvs-release"' in data),url
                      rows.append({'url':url,'status':r.status,'type':r.headers.get('Content-Type'),'cache':r.headers.get('Cache-Control')})
          open('verification/routes.json','w').write(json.dumps(rows,indent=2));print(json.dumps(rows,indent=2))
          PY
      - name: Install browser tool
        run: |
          npm install -g agent-browser
          echo "AGENT_BROWSER_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Open app and record hydration before update
        run: |
          timeout 45s agent-browser open https://bvsprotocol.com/
          timeout 20s agent-browser wait --load networkidle
          timeout 15s agent-browser eval '(() => {document.querySelector("[data-water=\"250\"]").click();document.querySelector("#scheduleList [data-check]").click();localStorage.setItem("bvs_update_test","preserve");return JSON.stringify({water:document.getElementById("waterAmount").textContent,taken:document.getElementById("takenCount").textContent});})()' > verification/before.json
      - name: Follow the public update link and verify the new app
        run: |
          timeout 45s agent-browser open 'https://bvsprotocol.com/update-bvs.html?lang=pt&release=3'
          timeout 50s agent-browser wait --url '**/app.html?bvs=20260909-3'
          timeout 20s agent-browser wait --load networkidle
          timeout 15s agent-browser eval '(() => {const saved=JSON.parse(localStorage.getItem("bvs_orbit_v1"));if(localStorage.getItem("bvs_update_test")!=="preserve")throw new Error("Existing storage deleted");if(!saved.events.some(e=>e.type==="water"&&e.amount===250))throw new Error("Water record missing");if(!saved.events.some(e=>e.type==="supplement"&&e.status==="taken"))throw new Error("Taken record missing");if(!document.querySelector("meta[name=bvs-release]"))throw new Error("Old app");return JSON.stringify({url:location.href,newApp:true,waterPreserved:true,takenPreserved:true,otherStoragePreserved:true,webgl:document.getElementById("atomFallback").classList.contains("loaded")});})()' > verification/after.json
          timeout 10s agent-browser set viewport 390 844
          timeout 20s agent-browser screenshot verification/new-mobile.png --full
      - name: Report results and any update errors
        if: always()
        run: |
          for file in verification/*.json; do [ ! -f "$file" ] || { echo "--- $file ---"; cat "$file"; echo; }; done
          timeout 10s agent-browser eval 'JSON.stringify({url:location.href,status:document.getElementById("status")?.textContent,details:document.getElementById("diagnostics")?.textContent,release:document.querySelector("meta[name=bvs-release]")?.content})' || true
          timeout 10s agent-browser errors || true
          timeout 10s agent-browser close || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bvs-public-update-results
          path: verification/
          retention-days: 14
