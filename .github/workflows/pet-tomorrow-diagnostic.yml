name: Pet Tomorrow live diagnostic
on:
  push:
    branches: ["pet-tomorrow-final"]
    paths:
      - '.github/workflows/pet-tomorrow-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve Netlify deploy host only
        shell: bash
        run: |
          set -u
          echo '=== netlify-mcp A ==='
          dig +short netlify-mcp.netlify.app A || true
          echo '=== netlify-mcp AAAA ==='
          dig +short netlify-mcp.netlify.app AAAA || true
          echo '=== current Pet Tomorrow host ==='
          dig +short pettomorrow.com A || true
