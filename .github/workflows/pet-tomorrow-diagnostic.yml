name: Pet Tomorrow live diagnostic
on:
  push:
    branches: ["pet-tomorrow-final"]
    paths:
      - '.github/workflows/pet-tomorrow-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Pet Tomorrow live assets only
        shell: bash
        run: |
          set -u
          for u in \
            https://pettomorrow.com/pt-logo-strip.png \
            https://pettomorrow.com/pt-hero-pets.png \
            https://pettomorrow.com/; do
            echo "=== $u ==="
            curl -fsSIL --max-time 20 "$u" || true
          done
