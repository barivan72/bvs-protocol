name: Pet Tomorrow live diagnostic
on:
  push:
    branches: ["pet-tomorrow-final"]
    paths:
      - '.github/workflows/pet-tomorrow-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify pettomorrow.com production PWA
        shell: bash
        run: |
          set -u
          echo '=== HOME HEADERS ==='
          curl -fsSIL --max-time 20 https://pettomorrow.com/ || true
          echo '=== HOME PWA MARKERS ==='
          curl -fsSL --max-time 20 https://pettomorrow.com/ | grep -Eio 'manifest[^" ]*|icon-192[^" ]*|icon-512[^" ]*|apple-touch-icon[^" ]*|data:image/svg\+xml|Pet Tomorrow' | head -80 || true
          echo '=== MANIFEST ==='
          curl -fsSL --max-time 20 https://pettomorrow.com/manifest.webmanifest || true
          echo
          echo '=== ICON 512 HEADERS ==='
          curl -fsSIL --max-time 20 https://pettomorrow.com/icon-512.png || true
          echo '=== SERVICE WORKER ==='
          curl -fsSL --max-time 20 https://pettomorrow.com/sw.js | head -c 3000 || true
          echo
