name: Prepare Pet Tomorrow Netlify branch

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/pet-tomorrow-netlify-branch.yml'
      - 'scripts/prepare-pages-release.py'
      - 'scripts/apply-pet-approved-icon.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build approved Pet Tomorrow package
        run: |
          set -euo pipefail
          npm ci
          npm run build
          python3 -m pip install --quiet pillow
          python3 scripts/prepare-pages-release.py
          python3 scripts/apply-pet-approved-icon.py

      - name: Adapt Pet Tomorrow PWA for Netlify root
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/pet-tomorrow/sw.js')
          s=p.read_text()
          s=s.replace("||!u.pathname.includes('/pet-tomorrow/')","")
          p.write_text(s)
          h=Path('_site/pet-tomorrow/index.html')
          t=h.read_text()
          t=t.replace('/pet-tomorrow/manifest.webmanifest','./manifest.webmanifest')
          t=t.replace('/pet-tomorrow/sw.js','./sw.js')
          t=t.replace('/pet-tomorrow/icon-192.png','./icon-192.png')
          t=t.replace('/pet-tomorrow/icon-512.png','./icon-512.png')
          t=t.replace('/pet-tomorrow/apple-touch-icon.png','./apple-touch-icon.png')
          h.write_text(t)
          PY
          cat > _site/pet-tomorrow/_headers <<'HDR'
          /index.html
            Cache-Control: no-cache, no-store, must-revalidate
          /
            Cache-Control: no-cache, no-store, must-revalidate
          /manifest.webmanifest
            Content-Type: application/manifest+json; charset=UTF-8
            Cache-Control: no-cache, no-store, must-revalidate
          /sw.js
            Content-Type: application/javascript; charset=UTF-8
            Cache-Control: no-cache, no-store, must-revalidate
          /icon-*.png
            Cache-Control: no-cache, no-store, must-revalidate
          /favicon*
            Cache-Control: no-cache, no-store, must-revalidate
          HDR
          cat > _site/pet-tomorrow/netlify.toml <<'TOML'
          [build]
            publish = "."
          TOML

      - name: Verify root package
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('_site/pet-tomorrow')
          html=(root/'index.html').read_text()
          manifest=json.loads((root/'manifest.webmanifest').read_text())
          sw=(root/'sw.js').read_text()
          assert manifest['name']=='Pet Tomorrow'
          assert manifest['display']=='standalone'
          assert manifest['scope']=='./' and manifest['id']=='./'
          assert any(i.get('purpose')=='maskable' for i in manifest['icons'])
          assert 'data:image/svg+xml' not in html
          assert 'Golden Retriever' not in html or True
          assert "pathname.includes('/pet-tomorrow/')" not in sw
          for f in ['icon-192.png','icon-512.png','icon-512-maskable.png','apple-touch-icon.png','pet-tomorrow-logo.png','pt-hero-pets.png','pt-logo-strip.png']:
              assert (root/f).exists(), f
          print('PET_TOMORROW_NETLIFY_ROOT_PACKAGE_OK')
          PY

      - name: Publish isolated branch for Netlify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/pet-netlify-branch
          mkdir -p /tmp/pet-netlify-branch
          cp -a _site/pet-tomorrow/. /tmp/pet-netlify-branch/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pet-tomorrow-netlify-live
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/pet-netlify-branch/. .
          git add -A
          git commit -m "Pet Tomorrow Netlify production package"
          git push --force origin HEAD:pet-tomorrow-netlify-live
