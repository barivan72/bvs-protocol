name: Verify Rex Relax custom domain
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-rex-custom-domain.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Triple-check Rex Relax custom-domain PWA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, struct, time, urllib.request
          base='https://bvsprotocol.com/rex-relax/'
          def get(path,binary=False):
              u=base+path+('?' if '?' not in path else '&')+'verify='+str(time.time())
              req=urllib.request.Request(u,headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/142.0 Mobile Safari/537.36'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  body=r.read(); return r.status,r.geturl(),r.headers.get('content-type',''),body if binary else body.decode()
          def size(b):
              assert b[:8]==b'\x89PNG\r\n\x1a\n'; return struct.unpack('>II',b[16:24])
          for n in (1,2,3):
              s,u,ct,h=get('index.html')
              _,_,mct,mt=get('manifest.webmanifest'); m=json.loads(mt)
              _,_,sct,sw=get('sw.js')
              _,_,_,i192=get('icon-192.png',True); _,_,_,i512=get('icon-512.png',True)
              assert s==200 and 'Rex Relax' in h
              assert m['name']=='Rex Relax' and m['display']=='standalone'
              assert m['scope']=='/rex-relax/' and m['id']=='/rex-relax/'
              assert size(i192)==(192,192) and size(i512)==(512,512)
              assert 'rex-relax-2026-09-16-7' in sw
              print('CUSTOM_DOMAIN_REX_OK',n,u,ct,mct,sct)
              time.sleep(2)
          PY