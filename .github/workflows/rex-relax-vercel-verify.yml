name: Verify Rex Relax public PWA

on:
  push:
    branches: [main]
    paths:
      - 'orbit/rex-relax/**'
      - 'scripts/verify-rex-release.mjs'
      - 'vercel.json'
      - '.github/workflows/rex-relax-vercel-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rex-relax-public-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify source release
        uses: actions/checkout@v4
      - name: Wait for and verify public Rex Relax PWA twice
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, struct, time, urllib.request
          base='https://bvs-protocol.vercel.app/rex-relax/'
          def request(path,binary=False):
              url=base+path
              req=urllib.request.Request(url+('?' if '?' not in url else '&')+'verify='+str(time.time()),headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/142.0 Mobile Safari/537.36'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  data=r.read()
                  return r.status,r.geturl(),r.headers.get('content-type',''),data if binary else data.decode()
          last=None
          for attempt in range(36):
              try:
                  status,final,ctype,html=request('index.html')
                  mt=request('manifest.webmanifest')[3]
                  manifest=json.loads(mt)
                  sw=request('sw.js')[3]
                  i192=request('icon-192.png',True)[3]
                  i512=request('icon-512.png',True)[3]
                  data=request('audio-v5-data.js')[3]
                  def size(b):
                      assert b[:8]==b'\x89PNG\r\n\x1a\n'
                      return struct.unpack('>II',b[16:24])
                  assert status==200 and 'Rex Relax' in html
                  assert manifest['name']=='Rex Relax'
                  assert manifest['display']=='standalone'
                  assert manifest['id']=='/rex-relax/' and manifest['scope']=='/rex-relax/'
                  assert manifest['start_url'].startswith('/rex-relax/index.html')
                  assert any(i['sizes']=='192x192' and i['type']=='image/png' for i in manifest['icons'])
                  assert any(i['sizes']=='512x512' and i['type']=='image/png' for i in manifest['icons'])
                  assert size(i192)==(192,192) and size(i512)==(512,512)
                  assert 'rex-relax-2026-09-16-7' in sw
                  assert data.count('"type": "music"')==20
                  assert data.count('"type": "guided"')==5
                  assert 'static.wixstatic.com' not in mt
                  print('PUBLIC_REX_RELAX_OK attempt',attempt+1,final,ctype)
                  break
              except Exception as exc:
                  last=exc
                  print('WAITING_FOR_REX_RELAX_DEPLOY',attempt+1,repr(exc))
                  time.sleep(10)
          else:
              raise SystemExit('Rex Relax public PWA did not become valid: '+repr(last))
          # second independent pass
          time.sleep(2)
          for path in ('','index.html','manifest.webmanifest','sw.js','icon-192.png','icon-512.png'):
              status,final,ctype,body=request(path, path.endswith('.png'))
              assert status==200, (path,status)
              print('SECOND_PASS_OK',path or '/',final,ctype,len(body))
          PY
