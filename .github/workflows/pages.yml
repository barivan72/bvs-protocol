name: Publish frozen Rex Relax and Pet Tomorrow PWAs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: npm ci

      - name: Recreate approved Rex Relax source assets
        run: npm run build

      - name: Install image dependency
        run: python3 -m pip install --quiet pillow

      - name: Seal Rex Relax bytes and build Pet Tomorrow PWA
        run: python3 scripts/prepare-pages-release.py

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Triple-check public Rex freeze and Pet Tomorrow release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/verify-pages-public.py "$PAGE_URL"

      - name: Install Chrome PWA probe
        run: npm install --no-save chrome-remote-interface

      - name: Triple-check Pet Tomorrow installability in clean Chrome profiles
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-pet-installability.mjs "${PAGE_URL%/}/pet-tomorrow/?source=install&release=20260916-1"
