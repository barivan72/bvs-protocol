name: Publish BVS redirect and Rex Relax PWA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install existing build dependency
        run: npm ci --omit=dev

      - name: Prepare BVS redirect and standalone Rex Relax PWA
        run: |
          mkdir -p _site/rex-relax

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta http-equiv="refresh" content="0;url=https://bvsprotocol.com/"><link rel="canonical" href="https://bvsprotocol.com/"><title>BVS Protocol — Official website</title><style>body{margin:0;min-height:100vh;display:grid;place-content:center;background:#050a12;color:#edf5ff;font:18px system-ui,sans-serif;text-align:center;padding:24px}a{color:#9bcaff}</style></head><body><main><h1>BVS Protocol</h1><p>The current BVS app is on our official website.</p><p><a href="https://bvsprotocol.com/">Open BVS Protocol</a></p></main><script>location.replace('https://bvsprotocol.com/'+location.hash)</script></body></html>
          HTML
          cp _site/index.html _site/404.html
          touch _site/.nojekyll

          cat > _site/sw.js <<'JS'
          self.addEventListener('install', event => event.waitUntil(self.skipWaiting()));
          self.addEventListener('activate', event => event.waitUntil(self.clients.claim()));
          self.addEventListener('fetch', event => {
            if (event.request.mode === 'navigate') event.respondWith(Promise.resolve(Response.redirect('https://bvsprotocol.com/', 302)));
          });
          JS

          cp orbit/rex-relax/index.html _site/rex-relax/index.html
          cp orbit/rex-relax/audio-v5-data.js _site/rex-relax/audio-v5-data.js
          cp orbit/rex-relax/audio-v5.js _site/rex-relax/audio-v5.js
          cp orbit/rex-relax/audio-v5-core.js _site/rex-relax/audio-v5-core.js
          cp orbit/rex-relax/logo.jpg _site/rex-relax/logo.jpg
          cp orbit/rex-relax/icon.svg _site/rex-relax/icon.svg

          FFMPEG="$(node -e "process.stdout.write(require('ffmpeg-static'))")"
          "$FFMPEG" -loglevel error -y -i _site/rex-relax/logo.jpg -vf scale=192:192 -frames:v 1 -update 1 _site/rex-relax/icon-192.png
          "$FFMPEG" -loglevel error -y -i _site/rex-relax/logo.jpg -vf scale=512:512 -frames:v 1 -update 1 _site/rex-relax/icon-512.png

          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/rex-relax/index.html')
          s=p.read_text()
          s=s.replace('href="/rex-relax/manifest.webmanifest"','href="./manifest.webmanifest"')
          s=s.replace('href="/rex-relax/icon.svg" type="image/svg+xml"','href="./icon-512.png?v=20260916-6" type="image/png"')
          s=s.replace('href="/rex-relax/icon.svg"','href="./icon-512.png?v=20260916-6"')
          s=s.replace("navigator.serviceWorker.register('/rex-relax/sw.js',{scope:'/rex-relax/'})","navigator.serviceWorker.register('./sw.js',{scope:'./'})")
          s=s.replace('src="/rex-relax/audio-v5-data.js?v=20260913-9"','src="./audio-v5-data.js?v=20260916-6"')
          s=s.replace('src="/rex-relax/audio-v5.js?v=20260913-9"','src="./audio-v5.js?v=20260916-6"')
          s=s.replace('.mark{width:44px;height:44px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font:24px Georgia}', '.mark{width:44px;height:44px;border:1px solid var(--gold);border-radius:50%;object-fit:cover;display:block;background:#080806}')
          s=s.replace('<div class="mark">R</div>', '<img class="mark" src="./icon-192.png?v=20260916-6" alt="Rex Relax logo">')
          p.write_text(s)

          p=Path('_site/rex-relax/audio-v5.js')
          s=p.read_text().replace("core.src = '/rex-relax/audio-v5-core.js?v=20260916-2';","core.src = './audio-v5-core.js?v=20260916-6';")
          p.write_text(s)
          PY

          cat > _site/rex-relax/manifest.webmanifest <<'JSON'
          {
            "name":"Rex Relax",
            "short_name":"Rex Relax",
            "id":"./",
            "start_url":"./index.html?source=pwa",
            "scope":"./",
            "display":"standalone",
            "display_override":["standalone","minimal-ui"],
            "background_color":"#080806",
            "theme_color":"#080806",
            "description":"Rex Relax massage therapy app for sessions, music, client records and consent.",
            "prefer_related_applications":false,
            "icons":[
              {"src":"./icon-192.png?v=20260916-6","sizes":"192x192","type":"image/png","purpose":"any maskable"},
              {"src":"./icon-512.png?v=20260916-6","sizes":"512x512","type":"image/png","purpose":"any maskable"}
            ]
          }
          JSON

          cat > _site/rex-relax/sw.js <<'JS'
          const CACHE='rex-relax-pwa-2026-09-16-6';
          const BASE=new URL(self.registration.scope).pathname;
          const ASSETS=['./index.html','./manifest.webmanifest','./logo.jpg?v=20260916-6','./icon-192.png?v=20260916-6','./icon-512.png?v=20260916-6','./audio-v5-data.js?v=20260916-6','./audio-v5.js?v=20260916-6','./audio-v5-core.js?v=20260916-6'];
          self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',e=>e.waitUntil((async()=>{await self.clients.claim();const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('rex-relax-pwa-')&&k!==CACHE).map(k=>caches.delete(k)));})()));
          self.addEventListener('fetch',e=>{const u=new URL(e.request.url);if(e.request.method!=='GET'||u.origin!==self.location.origin||!u.pathname.startsWith(BASE))return;e.respondWith(fetch(e.request,{cache:'no-cache'}).then(r=>{if(r.ok){const copy=r.clone();caches.open(CACHE).then(c=>c.put(e.request,copy));}return r}).catch(async()=>await caches.match(e.request)||((e.request.mode==='navigate')?await caches.match('./index.html'):null)||new Response('Unavailable offline',{status:503})));});
          JS

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, struct
          APPROVED='b83e84131d371bd366103e67b682fe7febf61f7fefaaaf92d167099ebc9da752'
          def png_size(path):
              data=Path(path).read_bytes()
              assert data[:8]==b'\x89PNG\r\n\x1a\n', path
              return struct.unpack('>II', data[16:24])
          m=json.loads(Path('_site/rex-relax/manifest.webmanifest').read_text())
          h=Path('_site/rex-relax/index.html').read_text()
          a=Path('_site/rex-relax/audio-v5.js').read_text()
          d=Path('_site/rex-relax/audio-v5-data.js').read_text()
          logo=Path('_site/rex-relax/logo.jpg').read_bytes()
          assert hashlib.sha256(logo).hexdigest()==APPROVED
          assert len(logo)==9882 and logo[:2]==b'\xff\xd8'
          assert m['display']=='standalone'
          assert any(i['sizes']=='192x192' and 'maskable' in i['purpose'] for i in m['icons'])
          assert any(i['sizes']=='512x512' and 'maskable' in i['purpose'] for i in m['icons'])
          assert png_size('_site/rex-relax/icon-192.png')==(192,192)
          assert png_size('_site/rex-relax/icon-512.png')==(512,512)
          assert 'src="./icon-192.png?v=20260916-6" alt="Rex Relax logo"' in h
          assert '<div class="mark">R</div>' not in h
          assert './logo.jpg?v=20260916-6' in a
          assert 'static.wixstatic.com' not in a
          assert 'static.wixstatic.com' not in json.dumps(m)
          assert d.count('"type": "music"')==20
          assert d.count('"type": "guided"')==5
          assert './audio-v5-data.js?v=20260916-6' in h
          assert './audio-v5.js?v=20260916-6' in h
          assert "register('./sw.js',{scope:'./'})" in h
          print('REX_APPROVED_LOGO_BYTES_OK',APPROVED)
          print('REX_AUDIO_CATALOGUE_OK music=20 guided=5')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify Rex Relax PWA on the public URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, struct, time, urllib.request
          APPROVED='b83e84131d371bd366103e67b682fe7febf61f7fefaaaf92d167099ebc9da752'
          base=os.environ['PAGE_URL'].rstrip('/')+'/rex-relax/'
          def get(path, binary=False):
              url=base+path
              last=None
              for _ in range(20):
                  try:
                      req=urllib.request.Request(url+('&' if '?' in url else '?')+'verify='+str(time.time()),headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/142.0 Mobile Safari/537.36'})
                      with urllib.request.urlopen(req,timeout=10) as r:
                          data=r.read()
                          if r.status==200:
                              return data if binary else data.decode()
                  except Exception as e:
                      last=e
                  time.sleep(2)
              raise SystemExit(f'Public Rex Relax verification failed for {url}: {last}')
          def png_size(data):
              assert data[:8]==b'\x89PNG\r\n\x1a\n'
              return struct.unpack('>II',data[16:24])
          html=get('index.html')
          manifest_text=get('manifest.webmanifest')
          manifest=json.loads(manifest_text)
          worker=get('sw.js')
          audio=get('audio-v5.js')
          data=get('audio-v5-data.js')
          logo=get('logo.jpg',True)
          i192=get('icon-192.png',True)
          i512=get('icon-512.png',True)
          assert hashlib.sha256(logo).hexdigest()==APPROVED
          assert len(logo)==9882 and logo[:2]==b'\xff\xd8'
          assert manifest['name']=='Rex Relax'
          assert manifest['display']=='standalone'
          assert manifest['scope']=='./'
          assert manifest['prefer_related_applications'] is False
          assert png_size(i192)==(192,192)
          assert png_size(i512)==(512,512)
          assert 'src="./icon-192.png?v=20260916-6" alt="Rex Relax logo"' in html
          assert '<div class="mark">R</div>' not in html
          assert './logo.jpg?v=20260916-6' in audio
          assert 'static.wixstatic.com' not in audio
          assert 'static.wixstatic.com' not in manifest_text
          assert 'rex-relax-pwa-2026-09-16-6' in worker
          assert data.count('"type": "music"')==20
          assert data.count('"type": "guided"')==5
          print('PUBLIC_REX_EXACT_APPROVED_LOGO_OK',APPROVED,base)
          print('PUBLIC_REX_AUDIO_CATALOGUE_OK music=20 guided=5')
          PY
