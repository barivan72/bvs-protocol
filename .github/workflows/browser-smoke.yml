name: BVS desktop and mobile browser checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bvs-browser-verification
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install browser test tool
        run: |
          npm install -g agent-browser
          if command -v google-chrome >/dev/null; then
            echo "AGENT_BROWSER_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            agent-browser install
          fi
          mkdir -p verification
      - name: Open the public BVS app and capture desktop view
        run: |
          agent-browser open https://bvsprotocol.com/
          agent-browser wait --load networkidle
          agent-browser set viewport 1440 1000
          agent-browser snapshot -i > verification/desktop-elements.txt
          agent-browser screenshot verification/desktop.png
          agent-browser eval 'JSON.stringify({title:document.title,release:document.querySelector("meta[name=bvs-release]")?.content,webglRendered:document.getElementById("atomFallback")?.classList.contains("loaded"),canvas:!!document.getElementById("atom"),scheduleButtons: [...document.querySelectorAll("#scheduleList button")].map(x=>({text:x.textContent,label:x.getAttribute("aria-label")}))})' > verification/initial-state.json
      - name: Test hydration, Taken records, protocol, calendar, shop and history
        run: |
          agent-browser eval '(() => { const checks=[]; const ok=(v,m)=>{if(!v)throw new Error(m);checks.push(m)}; const show=v=>{document.querySelector(`[data-view="${v}"]`).click();ok(!document.getElementById(v).hidden,`${v} navigation`)}; ok(!!document.querySelector("meta[name=bvs-release]"),"current app"); const before=document.getElementById("waterAmount").textContent;document.querySelector("[data-water=\"250\"]").click();const after=document.getElementById("waterAmount").textContent;ok(after!==before,"hydration +250 mL");sessionStorage.setItem("bvs-test-water",after); const taken=document.querySelector("#scheduleList [data-check]");ok(!!taken,"Taken control exists");const oldCount=document.getElementById("takenCount").textContent;taken.click();const savedCount=document.getElementById("takenCount").textContent;ok(savedCount!==oldCount,"Taken record updates");sessionStorage.setItem("bvs-test-taken",savedCount);show("protocol");ok(document.getElementById("protocolProducts").children.length>0,"protocol products render");show("calendar");ok(document.getElementById("calendarGrid").children.length>=28,"calendar renders");show("shop");ok(document.querySelectorAll("#shopGrid a").length>=7,"shop links render");const links=[...document.querySelectorAll("#shopGrid a[href]")].map(a=>a.href);show("history");ok(document.getElementById("historyList").textContent.length>0,"history renders");show("settings");ok(!!document.querySelector("[data-install]"),"install control exists");show("today");return JSON.stringify({checks,links,water:after,taken:savedCount});})()' > verification/interaction-checks.json
      - name: Verify saved records survive a reload
        run: |
          agent-browser reload
          agent-browser wait --load networkidle
          agent-browser eval '(() => {const water=document.getElementById("waterAmount").textContent;const taken=document.getElementById("takenCount").textContent;if(water!==sessionStorage.getItem("bvs-test-water"))throw new Error("Hydration was not retained");if(taken!==sessionStorage.getItem("bvs-test-taken"))throw new Error("Taken record was not retained");return JSON.stringify({savedWater:water,taken,persistence:true});})()' > verification/persistence-checks.json
      - name: Verify mobile navigation and layout
        run: |
          agent-browser set viewport 390 844
          agent-browser eval '(() => {const nav=document.querySelector(".mobile-nav");if(getComputedStyle(nav).display==="none")throw new Error("Mobile navigation is hidden");const overflow=document.documentElement.scrollWidth-window.innerWidth;if(overflow>2)throw new Error(`Horizontal mobile overflow: ${overflow}px`);nav.querySelector("[data-view=calendar]").click();if(document.getElementById("calendar").hidden)throw new Error("Mobile calendar navigation failed");nav.querySelector("[data-view=today]").click();window.scrollTo(0,0);return JSON.stringify({viewport:window.innerWidth,overflow,mobileNavigation:true});})()' > verification/mobile-checks.json
          agent-browser snapshot -i > verification/mobile-elements.txt
          agent-browser screenshot verification/mobile.png --full
          agent-browser errors > verification/browser-errors.txt
      - name: Print test results
        if: always()
        run: |
          for file in verification/*.json verification/browser-errors.txt; do if [ -f "$file" ]; then echo "--- $file ---"; cat "$file"; fi; done
          agent-browser close || true
      - name: Save screenshots and browser test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bvs-browser-verification
          path: verification/
