name: Deploy Rex Relax standalone PWA to Netlify

on:
  push:
    branches: [main]
    paths:
      - 'orbit/rex-relax/**'
      - '.github/workflows/rex-relax-netlify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare standalone Rex Relax PWA
        run: |
          set -euo pipefail
          rm -rf _rex_netlify
          mkdir -p _rex_netlify

          cp orbit/rex-relax/index.html _rex_netlify/index.html
          cp orbit/rex-relax/audio-v5-data.js _rex_netlify/audio-v5-data.js
          cp orbit/rex-relax/audio-v5.js _rex_netlify/audio-v5.js
          cp orbit/rex-relax/audio-v5-core.js _rex_netlify/audio-v5-core.js
          cp orbit/rex-relax/logo.jpg _rex_netlify/logo.jpg
          cp orbit/rex-relax/icon-192.png _rex_netlify/icon-192.png
          cp orbit/rex-relax/icon-512.png _rex_netlify/icon-512.png

          python3 - <<'PY'
          from pathlib import Path
          p=Path('_rex_netlify/index.html')
          s=p.read_text()
          s=s.replace('href="/rex-relax/manifest.webmanifest"','href="./manifest.webmanifest"')
          s=s.replace('href="/rex-relax/icon.svg" type="image/svg+xml"','href="./icon-512.png?v=netlify-20260916-1" type="image/png"')
          s=s.replace('href="/rex-relax/icon.svg"','href="./icon-512.png?v=netlify-20260916-1"')
          s=s.replace("navigator.serviceWorker.register('/rex-relax/sw.js',{scope:'/rex-relax/'})","navigator.serviceWorker.register('./sw.js',{scope:'./'})")
          s=s.replace('src="/rex-relax/audio-v5-data.js?v=20260913-9"','src="./audio-v5-data.js?v=netlify-20260916-1"')
          s=s.replace('src="/rex-relax/audio-v5.js?v=20260913-9"','src="./audio-v5.js?v=netlify-20260916-1"')
          s=s.replace('.mark{width:44px;height:44px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font:24px Georgia}', '.mark{width:52px;height:52px;border:1px solid var(--gold);border-radius:50%;object-fit:cover;display:block;background:#080806;flex:0 0 52px}')
          s=s.replace('<div class="mark">R</div>', '<img class="mark" src="./icon-192.png?v=netlify-20260916-1" alt="Rex Relax logo">')
          p.write_text(s)

          p=Path('_rex_netlify/audio-v5.js')
          s=p.read_text()
          s=s.replace("core.src = '/rex-relax/audio-v5-core.js?v=20260916-2';","core.src = './audio-v5-core.js?v=netlify-20260916-1';")
          s=s.replace("const icon = './logo.jpg?v=20260916-6';","const icon = './logo.jpg?v=netlify-20260916-1';")
          p.write_text(s)
          PY

          cat > _rex_netlify/manifest.webmanifest <<'JSON'
          {
            "name": "Rex Relax",
            "short_name": "Rex Relax",
            "id": "/",
            "start_url": "/?source=pwa&release=20260916-1",
            "scope": "/",
            "display": "standalone",
            "display_override": ["standalone", "minimal-ui"],
            "background_color": "#080806",
            "theme_color": "#080806",
            "description": "Rex Relax massage therapy app for sessions, music, client records and consent.",
            "prefer_related_applications": false,
            "icons": [
              {"src":"/icon-192.png?v=20260916-1","sizes":"192x192","type":"image/png","purpose":"any maskable"},
              {"src":"/icon-512.png?v=20260916-1","sizes":"512x512","type":"image/png","purpose":"any maskable"}
            ]
          }
          JSON

          cat > _rex_netlify/sw.js <<'JS'
          const CACHE='rex-relax-netlify-2026-09-16-1';
          const ASSETS=['/','/index.html','/manifest.webmanifest','/logo.jpg','/icon-192.png?v=20260916-1','/icon-512.png?v=20260916-1','/audio-v5-data.js?v=netlify-20260916-1','/audio-v5.js?v=netlify-20260916-1','/audio-v5-core.js?v=netlify-20260916-1'];
          self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',e=>e.waitUntil((async()=>{await self.clients.claim();const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('rex-relax-netlify-')&&k!==CACHE).map(k=>caches.delete(k)));})()));
          self.addEventListener('fetch',e=>{const u=new URL(e.request.url);if(e.request.method!=='GET'||u.origin!==self.location.origin)return;e.respondWith(fetch(e.request,{cache:'no-cache'}).then(r=>{if(r.ok){const copy=r.clone();caches.open(CACHE).then(c=>c.put(e.request,copy));}return r}).catch(async()=>await caches.match(e.request)||((e.request.mode==='navigate')?await caches.match('/index.html'):null)||new Response('Unavailable offline',{status:503})));});
          JS

          cat > _rex_netlify/_headers <<'HDR'
          /manifest.webmanifest
            Content-Type: application/manifest+json
            Cache-Control: no-cache, no-store, must-revalidate
          /sw.js
            Content-Type: application/javascript
            Cache-Control: no-cache, no-store, must-revalidate
          /index.html
            Cache-Control: no-cache, no-store, must-revalidate
          /*
            X-Content-Type-Options: nosniff
          HDR

          python3 - <<'PY'
          from pathlib import Path
          import json, struct
          html=Path('_rex_netlify/index.html').read_text()
          manifest=json.loads(Path('_rex_netlify/manifest.webmanifest').read_text())
          data=Path('_rex_netlify/audio-v5-data.js').read_text()
          audio=Path('_rex_netlify/audio-v5.js').read_text()
          def png_size(name):
              b=Path('_rex_netlify',name).read_bytes()
              assert b[:8]==b'\x89PNG\r\n\x1a\n', name
              return struct.unpack('>II',b[16:24])
          assert manifest['name']=='Rex Relax'
          assert manifest['display']=='standalone'
          assert manifest['id']=='/' and manifest['scope']=='/'
          assert manifest['start_url'].startswith('/?source=pwa')
          assert png_size('icon-192.png')==(192,192)
          assert png_size('icon-512.png')==(512,512)
          assert './manifest.webmanifest' in html
          assert "register('./sw.js',{scope:'./'})" in html
          assert 'src="./icon-192.png?v=netlify-20260916-1" alt="Rex Relax logo"' in html
          assert '<div class="mark">R</div>' not in html
          assert './logo.jpg?v=netlify-20260916-1' in audio
          assert data.count('"type": "music"')==20
          assert data.count('"type": "guided"')==5
          print('REX_NETLIFY_PACKAGE_OK music=20 guided=5 icons=192,512 standalone=true')
          PY

      - name: Deploy production to Rex Relax Netlify project
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 245e0d79-d927-48fa-9702-ad779db8dc06
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "NETLIFY_AUTH_TOKEN is missing"
            exit 1
          fi
          npx --yes netlify-cli@latest deploy --prod --dir=_rex_netlify --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"

      - name: Verify public Rex Relax Netlify PWA twice
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, struct, time, urllib.request
          base='https://rex-relax.netlify.app/'
          def get(path,binary=False):
              last=None
              for _ in range(20):
                  try:
                      req=urllib.request.Request(base+path+('?' if '?' not in path else '&')+'verify='+str(time.time()),headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/142.0 Mobile Safari/537.36'})
                      with urllib.request.urlopen(req,timeout=15) as r:
                          b=r.read()
                          if r.status==200:return b if binary else b.decode()
                  except Exception as e:last=e
                  time.sleep(2)
              raise SystemExit(f'PUBLIC_VERIFY_FAILED {path}: {last}')
          def png_size(b):
              assert b[:8]==b'\x89PNG\r\n\x1a\n'
              return struct.unpack('>II',b[16:24])
          for pass_no in (1,2):
              html=get('index.html')
              mt=get('manifest.webmanifest')
              m=json.loads(mt)
              sw=get('sw.js')
              i192=get('icon-192.png',True)
              i512=get('icon-512.png',True)
              assert m['name']=='Rex Relax' and m['display']=='standalone'
              assert m['id']=='/' and m['scope']=='/'
              assert png_size(i192)==(192,192) and png_size(i512)==(512,512)
              assert "register('./sw.js',{scope:'./'})" in html
              assert 'rex-relax-netlify-2026-09-16-1' in sw
              assert 'static.wixstatic.com' not in mt
              assert 'barivan72.github.io' not in html
              print('PUBLIC_REX_NETLIFY_OK',pass_no,base)
          PY
