name: Verify Rex Relax browser installability
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-rex-browser-install.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare Chrome installability probe
        run: npm install --no-save chrome-remote-interface
      - name: Triple-check PWA installability in clean Chrome profiles
        run: |
          set -euo pipefail
          for PASS in 1 2 3; do
            rm -rf "/tmp/rex-chrome-$PASS"
            google-chrome --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir="/tmp/rex-chrome-$PASS" 'https://bvsprotocol.com/rex-relax/' >/tmp/rex-chrome.log 2>&1 &
            CHROME_PID=$!
            trap 'kill $CHROME_PID 2>/dev/null || true' EXIT
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then break; fi
              sleep 0.5
            done
            PASS="$PASS" node <<'NODE'
          const CDP=require('chrome-remote-interface');
          (async()=>{
            const pass=process.env.PASS;
            const targets=await CDP.List({host:'127.0.0.1',port:9222});
            const target=targets.find(t=>t.type==='page' && t.url.includes('bvsprotocol.com/rex-relax')) || targets.find(t=>t.type==='page');
            if(!target) throw new Error('No Chrome page target');
            const client=await CDP({target,host:'127.0.0.1',port:9222});
            const {Page,Runtime}=client;
            await Page.enable();
            await new Promise(r=>setTimeout(r,2500));
            const installability=await Page.getInstallabilityErrors();
            const manifestResult=await Page.getAppManifest();
            const state=await Runtime.evaluate({expression:`(async()=>{
              const reg=await navigator.serviceWorker.ready;
              const m=document.querySelector('link[rel="manifest"]');
              return {title:document.title,url:location.href,manifest:m&&m.href,serviceWorkerScope:reg&&reg.scope,icons:[...document.querySelectorAll('link[rel~="icon"],link[rel="apple-touch-icon"]')].map(x=>x.href)};
            })()`,awaitPromise:true,returnByValue:true});
            const info={pass:Number(pass),installabilityErrors:installability.installabilityErrors,manifestUrl:manifestResult.url,state:state.result.value};
            console.log(JSON.stringify(info));
            if(!manifestResult.url || !manifestResult.url.includes('/rex-relax/manifest.webmanifest')) throw new Error('Wrong manifest URL');
            if(!state.result.value?.serviceWorkerScope?.endsWith('/rex-relax/')) throw new Error('Wrong or missing service worker scope');
            if(installability.installabilityErrors.length) throw new Error('Chrome installability errors: '+JSON.stringify(installability.installabilityErrors));
            await client.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
            kill "$CHROME_PID" 2>/dev/null || true
            wait "$CHROME_PID" 2>/dev/null || true
            trap - EXIT
          done