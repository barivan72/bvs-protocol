# Vercel is the only source of the approved BVS application.
# Keep legacy Netlify URLs and clients with old DNS working without a second UI.
# This proxy preserves the visitor's origin and existing local records.
[build]
  publish = "orbit"

[[redirects]]
  from = "/*"
  to = "https://bvs-protocol.vercel.app/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"
